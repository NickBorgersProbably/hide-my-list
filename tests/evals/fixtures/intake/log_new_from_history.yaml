---
# After a completion clarification the user says the thing is new and asks to
# log it. The task lives in the earlier message, not the current one: intake
# saves it from Previous context instead of asking what to add, and never
# returns already_done for this answer.
id: intake-log-new-from-history-001
node: intake
tier: medium
peer: "<test-peer-intake-log-new>"
inbound: "no it's new, just log it"
prior_state:
  active_task: null
  conversation_state: idle
  user_prefs:
    timezone: America/Chicago
  messages:
    - role: user
      content: "I also paid the gas bill!"
    - role: assistant
      content: "Nice! Which one was that — Book the dentist, or Email the landlord about the lease?"
contracts:
  - kind: regex_require
    pattern: "\\{task\\}"
  - kind: judge
    rubric: |
      The reply confirms saving a task about the gas bill (the delivered text
      names it). Score 1.0 when a gas-bill task is confirmed. Score 0.0 when
      it asks what to add, asks which task again, or names a different task.
    threshold: 0.8
