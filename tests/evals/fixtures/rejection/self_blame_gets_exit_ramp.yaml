---
# A rejection carrying self-blame. docs/ai-prompts/rejection.md, "Emotional
# Distress Detection", Self-blame row: "I'm useless", "what's wrong with me"
# -> "Nothing's wrong with you. Brains just work differently with different
# tasks — that's not a flaw. Want to step away for a bit?" The distress comes
# first: a reply that skips past it to the next task suggestion treats the
# user's statement about themselves as noise, and cheerleading ("you've got
# this!") dismisses it.
#
# This fixture encodes the spec, not the runtime: rejection.md.j2 does not
# yet carry the "want to step away" exit ramp, so it currently reframes (if
# at all) and then pitches another task anyway. The judge rubric below gives
# zero credit for that. This fixture is EXPECTED TO FAIL against the current
# runtime prompt — that failure is the point: it proves the gap between
# docs/ai-prompts/rejection.md and app/prompts/rejection.md.j2 until the
# template is updated to offer the exit ramp.
id: rejection-self-blame-001
node: rejection
tier: medium
peer: "<test-peer-rejection-self-blame>"
inbound: "no. whats wrong with me, i cant even do the easy ones"
prior_state:
  active_task:
    page_id: "<placeholder-page-id-1>"
    title: "Fold the laundry"
    rejection_count: 1
  conversation_state: active
  available_minutes: 30
  mood: neutral
notion_tasks:
  - id: "<placeholder-page-id-1>"
    title: "Fold the laundry"
    work_type: "Physical"
    time_estimate: 20
  - id: "<placeholder-page-id-2>"
    title: "Pay the water bill"
    work_type: "Independent"
    time_estimate: 10
contracts:
  - kind: regex_forbid
    pattern: "(?i)(easy ones? (are|is) easy|it's (just|only) (laundry|a small task)|you can do (it|this)!)"
  # Reliable, low-noise net: the substituted body must not name either
  # available task — self-blame gets an exit ramp, not a pitch.
  - kind: regex_forbid
    pattern: "(?i)(fold the laundry|pay the water bill)"
  - kind: shame_safe
    threshold: 0.9
  - kind: judge
    rubric: |
      The user rejected a task and said "what's wrong with me" — self-blame
      per docs/ai-prompts/rejection.md, "Emotional Distress Detection". The
      required response reframes the self-blame first, directly and briefly
      (nothing is wrong with them; brains just work differently with
      different tasks — not a flaw), and then offers to step away ("Want to
      step away for a bit?" or a clear equivalent, e.g. "let's pause" or
      "take a break") instead of another task. Score 1.0 only when the reply
      does both: reframes the self-blame AND offers that exit ramp, with no
      task named, implied, or pitched anywhere in the reply. Score 0.0 when
      it ignores the self-blame and just pitches another task, agrees the
      task was easy, cheerleads ("you've got this!") in a way that dismisses
      the feeling, or reframes but never offers to step away. Award partial
      credit only when both elements are present but phrased awkwardly.
    threshold: 0.8
