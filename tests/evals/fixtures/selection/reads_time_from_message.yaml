---
# The user states their available time and energy in the message itself;
# nothing in state carries them (`available_minutes` and `mood` are null).
# The selection prompt passes the incoming message under "User Context" and
# tells the model to read time and mood from it when the state fields are
# empty. A prompt that ignores the stated two hours and energy suggests the
# short errand instead of the task that uses a two-hour focus block, which
# fails the judge contract below.
id: selection-reads-time-from-message-001
node: selection
tier: expensive
peer: "<test-peer-ledger-2>"
inbound: "I've got a solid 2 hours and I'm feeling really sharp — what should I tackle?"
prior_state:
  active_task: null
  conversation_state: idle
  available_minutes: null
  mood: null
  user_prefs:
    timezone: America/Chicago
notion_tasks:
  - id: "<placeholder-page-id-1>"
    title: "Draft the project proposal"
    work_type: "Focus"
    energy_required: "High"
    urgency: 80
    time_estimate: 90
  - id: "<placeholder-page-id-2>"
    title: "Drop off the dry cleaning"
    work_type: "Independent"
    energy_required: "Low"
    urgency: 30
    time_estimate: 20
contracts:
  - kind: regex_require
    pattern: "\\{task\\}"
  - kind: shame_safe
    threshold: 0.8
  - kind: judge
    rubric: |
      The user said they have about two hours and feel sharp. The pending
      tasks are "Draft the project proposal" (focus work, 90 minutes, high
      urgency) and "Drop off the dry cleaning" (low-energy errand, 20
      minutes). The right suggestion is "Draft the project proposal": it
      fits the two-hour window and matches a sharp, focused mood. Score 1.0
      when the response suggests exactly that task, 0.0 when it suggests the
      dry cleaning or claims nothing fits the time available.
    threshold: 0.7
