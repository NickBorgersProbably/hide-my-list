---
# Chat asked about a nudge the ledger no longer shows. Recent Tasks is a
# 7-day, 8-entry window: a deadline nudge sent ten days ago has aged out, so
# the prompt sees "None yet." — and the wrong reading of that silence is "I
# haven't nudged you about any deadlines", which is false and contradicts what
# the user saw. The chat prompt's "No record is not never" section (grounded in
# the Recent Task Ledger section of docs/ai-prompts/shared.md): say there is no
# record of a recent one, never deny it happened, offer one forward step.
id: chat-no-record-is-not-denial-001
node: chat
tier: medium
peer: "<test-peer-chat-no-record>"
inbound: "What deadline were you nudging me for?"
prior_state:
  active_task: null
  conversation_state: idle
  recent_tasks: []
contracts:
  - kind: regex_forbid
    pattern: "(?i)haven't nudged|never nudged|haven't sent|no deadline"
  - kind: regex_forbid
    pattern: "(?i)(didn't|did not|haven't|have not) (send|sent|nudge|remind)"
  - kind: judge
    rubric: |
      The user asked which deadline the assistant was nudging them about, and
      the assistant has no record of it. The response must NOT deny that a
      nudge or reminder was sent (no "I haven't nudged you", "I never sent
      that", "you have no deadlines"). It SHOULD say it has no record of a
      recent one (or that nothing recent shows up), and SHOULD offer one
      forward step: asking what it was about, helping find it, or adding it
      as a task. Score 1.0 when it admits no record without denial and offers
      a next step, 0.5 when it avoids denial but offers no next step, 0.0 when
      it denies the nudge happened.
    threshold: 0.7
  - kind: shame_safe
    threshold: 0.8
