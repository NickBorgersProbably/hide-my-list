---
name: Review pipeline v2 — Codex fixer smoke test

# Pre-merge smoke for the fresh-fallback fixer container path (the
# review-codex-run invocation review-fixer.yml uses when there is no
# resumable Author-Session, e.g. human-authored PRs). Auto-runs on any
# PR that touches files governing the runtime contract that path
# depends on, so a broken auth / flag / env-forwarding / workspace-write
# regression surfaces here instead of in the next real review cycle
# (rule 2.9). The read-only reviewer path already gets organic coverage
# on every PR; this smoke exists because read_only=false (workspace
# write) is only exercised on the less-common fallback-fixer path.
#
# Same-repo only — workflow runs on `self-hosted` and forwards
# `WORKFLOW_PAT`, so fork PRs must not execute it. Mirrors the guard
# pattern in `.github/workflows/pr-tests.yml`.

on:
  pull_request:
    branches:
      - main
      - master
      - '**'
    paths:
      - '.github/actions/review-codex-run/**'
      - '.github/workflows/review-fixer.yml'
      - '.github/workflows/review-fixer-codex-smoke.yml'
      - '.github/scripts/review/prompts/fixer.md'
      - '.github/scripts/review/prompts/fixer-codex-smoke.md'
      - '.github/ci/Dockerfile'
      - '.github/ci/versions.env'
      - '.github/ci/agent-models.env'
      - '.github/ci/caveman-rules.md'
      - '.devcontainer/configure-codex.sh'
  workflow_dispatch:
    inputs:
      image:
        description: CI image tag to test
        required: false
        default: ghcr.io/nickborgersprobably/hide-my-list-ci:latest

concurrency:
  group: review-fixer-codex-smoke-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: Codex fixer smoke
    runs-on: self-hosted
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4

      - name: Create directories for CI mounts
        run: mkdir -p ~/.config/gh ~/.claude ~/.codex

      - name: Seed sample reviewer artifacts
        run: |
          set -euo pipefail
          mkdir -p .review-output/reviewer-artifacts/docs
          cat > .review-output/reviewer-artifacts/docs/docs-result.json <<'JSON'
          {
            "blocking_issues": [
              {
                "id": "docs/doc-001",
                "message": "replace stale docs path",
                "file": "docs/architecture.md",
                "line": 1
              }
            ]
          }
          JSON

      # Smoke tests are mechanical plumbing checks, not judgment calls,
      # so this uses the Luna tier regardless of what tier the fresh-
      # fallback fixer uses in production (frontier). See
      # .github/ci/agent-models.env.
      - name: Select Codex model tier
        id: model-tier
        run: |
          set -euo pipefail
          # Defensive fallback in case this checkout predates
          # .github/ci/agent-models.env (e.g. it was deleted, or this
          # step is copy-pasted into a workflow whose checkout doesn't
          # guarantee the file). Values below must exactly match
          # .github/ci/agent-models.env; scripts/test-agent-model-tier.sh
          # fails the build if they drift.
          if [ -f .github/ci/agent-models.env ]; then
            # shellcheck disable=SC1091
            source .github/ci/agent-models.env
          else
            echo "::notice::agent-models.env missing on this checkout; using built-in defaults"
            CODEX_MODEL_FRONTIER=gpt-5.6-sol
            CODEX_REASONING_FRONTIER=high
            CODEX_MODEL_LUNA=gpt-5.6-luna
            CODEX_REASONING_LUNA=low
          fi
          echo "model=$CODEX_MODEL_LUNA" >> "$GITHUB_OUTPUT"
          echo "reasoning_effort=$CODEX_REASONING_LUNA" >> "$GITHUB_OUTPUT"

      - name: Run Codex smoke prompt
        id: run
        uses: ./.github/actions/review-codex-run
        with:
          role: fixer-smoke
          prompt_path: .github/scripts/review/prompts/fixer-codex-smoke.md
          image: ${{ inputs.image || 'ghcr.io/nickborgersprobably/hide-my-list-ci:latest' }}
          workspace_folder: .
          pr_number: ''
          reviewed_sha: ${{ github.sha }}
          cycle: smoke
          read_only: 'false'
          workflow_pat: ${{ secrets.WORKFLOW_PAT }}
          extra_env: |
            REVIEWER_ARTIFACTS_DIR=.review-output/reviewer-artifacts
            SMOKE_TARGET_PATH=.review-output/codex-smoke-target.txt
            CODEX_MODEL=${{ steps.model-tier.outputs.model }}
            CODEX_MODEL_REASONING_EFFORT=${{ steps.model-tier.outputs.reasoning_effort }}

      - name: Verify smoke results
        env:
          RESULT_JSON: ${{ steps.run.outputs.result_json }}
          OUTPUT_LOG: ${{ steps.run.outputs.output_artifact }}
        run: |
          set -euo pipefail
          jq -e '
            .auth_ok == true
            and .workspace_write_ok == true
            and .first_blocker_id == "docs/doc-001"
            and .first_blocker_message == "replace stale docs path"
            and .workspace_write_path == ".review-output/codex-smoke-target.txt"
            and (.artifact_files | length) >= 1
          ' "$RESULT_JSON" >/dev/null
          test -s "$OUTPUT_LOG"
          grep -Fxq 'codex-smoke:docs/doc-001:replace stale docs path' .review-output/codex-smoke-target.txt

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-fixer-codex-smoke-${{ github.run_id }}
          path: |
            .review-output/fixer-smoke-result.json
            .review-output/fixer-smoke-output.jsonl
            .review-output/codex-smoke-target.txt
            .review-output/reviewer-artifacts
