---
# A past-tense report of something the user did is COMPLETE even when it
# names something that was never on the list. Production routed this shape to
# ADD_TASK, and intake then saved an already-finished thing as a new task.
id: classify-intent-past-tense-report-001
node: classify_intent
tier: cheap
peer: "<test-peer-classify-past-tense>"
inbound: "I also paid the gas bill!"
prior_state:
  messages: []
  recent_tasks:
    - page_id: "<placeholder-page-id-1>"
      title: "Book the dentist"
      kind: task
      event: added
    - page_id: "<placeholder-page-id-2>"
      title: "Email the landlord about the lease"
      kind: task
      event: added
contracts:
  - kind: regex_require
    pattern: "COMPLETE"
  - kind: regex_forbid
    pattern: "ADD_TASK"
