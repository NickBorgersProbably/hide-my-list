---
# Third rejection in a row. docs/ai-prompts/rejection.md, "Escalation After
# Multiple Rejections": the third no gets explicit normalization ("Sometimes
# the brain just isn't in task mode. That's not a failure — it's
# information.") and then a constrained choice between describing their mood
# and taking a break — not a fresh task. Two earlier declines are in the
# history and the ledger, so the model can see it is the third and which
# tasks are off the table.
#
# This fixture encodes the spec, not the runtime: rejection.md.j2 does not
# yet carry the mood-or-break choice, so it currently normalizes (if at all)
# and then offers another task anyway. The judge rubric below gives zero
# credit for that. This fixture is EXPECTED TO FAIL against the current
# runtime prompt — that failure is the point: it proves the gap between
# docs/ai-prompts/rejection.md and app/prompts/rejection.md.j2 until the
# template is updated to carry the mood-or-break choice.
id: rejection-third-no-normalizes-001
node: rejection
tier: medium
peer: "<test-peer-rejection-third>"
inbound: "nope not that either"
prior_state:
  active_task:
    page_id: "<placeholder-page-id-3>"
    title: "Sort the mail pile"
    rejection_count: 0
  conversation_state: active
  available_minutes: 30
  mood: neutral
  messages:
    - role: user
      content: "what should i do"
    - role: assistant
      content: "How about Fold the laundry?"
    - role: user
      content: "nah"
    - role: assistant
      content: "No problem — here's something different: Pay the water bill?"
    - role: user
      content: "no"
    - role: assistant
      content: "Your no's help me learn — trying something else: Sort the mail pile?"
  recent_tasks:
    - page_id: "<placeholder-page-id-3>"
      title: "Sort the mail pile"
      kind: task
      event: suggested
    - page_id: "<placeholder-page-id-2>"
      title: "Pay the water bill"
      kind: task
      event: rejected
    - page_id: "<placeholder-page-id-1>"
      title: "Fold the laundry"
      kind: task
      event: rejected
notion_tasks:
  - id: "<placeholder-page-id-1>"
    title: "Fold the laundry"
    work_type: "Physical"
    time_estimate: 20
  - id: "<placeholder-page-id-2>"
    title: "Pay the water bill"
    work_type: "Independent"
    time_estimate: 10
  - id: "<placeholder-page-id-3>"
    title: "Sort the mail pile"
    work_type: "Independent"
    time_estimate: 25
  - id: "<placeholder-page-id-4>"
    title: "Water the plants"
    work_type: "Physical"
    time_estimate: 5
contracts:
  - kind: shame_safe
    threshold: 0.9
  # Reliable, low-noise net: the substituted body must not name ANY task
  # (previously rejected or not) — the third no gets a choice, not a pitch.
  - kind: regex_forbid
    pattern: "(?i)(fold the laundry|pay the water bill|sort the mail pile|water the plants)"
  - kind: judge
    rubric: |
      This is the user's third rejection in a row. docs/ai-prompts/rejection.md,
      "Escalation After Multiple Rejections", requires exactly this sequence:
      explicit normalization ("Sometimes the brain just isn't in task mode.
      That's not a failure — it's information." or a clear equivalent) and
      then a constrained choice between describing their mood and taking a
      break. Score 1.0 only when the reply normalizes first AND then offers
      that mood-or-break choice, with no task named, implied, or pitched
      anywhere in the reply. Score 0.0 when it suggests, names, or implies a
      next task in any form, when it skips the normalization and jumps to a
      break/mood offer, when it normalizes but never offers the choice, or
      when it implies the user is being difficult or picky. Award partial
      credit only when normalization and the choice are both present but
      phrased awkwardly.
    threshold: 0.8
