---
# "sure" right after a suggestion accepts it. Routing only: the classifier
# returns CHAT. GET_TASK would offer a second task, and ADD_TASK would save the
# suggested task again.
id: classify-intent-sure-after-suggestion-001
node: classify_intent
tier: cheap
peer: "<test-peer-classify-sure>"
inbound: "sure"
prior_state:
  conversation_state: active
  active_task:
    page_id: "<placeholder-page-id-1>"
    title: "Clean out the garage"
  messages:
    - role: user
      content: "what should I do?"
    - role: assistant
      content: "How about Clean out the garage? You've got the energy for it right now."
  recent_tasks:
    - page_id: "<placeholder-page-id-1>"
      title: "Clean out the garage"
      kind: task
      event: suggested
contracts:
  - kind: regex_require
    pattern: "CHAT"
  - kind: regex_forbid
    pattern: "GET_TASK|ADD_TASK|COMPLETE"
