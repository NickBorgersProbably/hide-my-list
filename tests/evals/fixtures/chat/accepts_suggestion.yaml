---
# The user accepts a suggestion with "sure". Chat confirms the Current task by
# name in one short sentence — it does not suggest something else or ask
# which task.
id: chat-accepts-suggestion-001
node: chat
tier: medium
peer: "<test-peer-chat-accepts>"
inbound: "sure"
prior_state:
  conversation_state: active
  active_task:
    page_id: "<placeholder-page-id-1>"
    title: "Clean out the garage"
  messages:
    - role: user
      content: "what should I do?"
    - role: assistant
      content: "How about this one? It should take about 90 minutes."
  recent_tasks:
    - page_id: "<placeholder-page-id-1>"
      title: "Clean out the garage"
      kind: task
      event: suggested
contracts:
  - kind: regex_require
    pattern: "(?i)garage"
  - kind: regex_forbid
    pattern: "(?i)which (one|task)"
  - kind: shame_safe
    threshold: 0.85
  - kind: judge
    rubric: |
      The user accepted the suggested task. The reply confirms "Clean out the
      garage" by name, briefly, and does not suggest a different task or ask
      the user a clarifying question. Score 1.0 for a brief named
      confirmation, 0.5 if it names the task but also asks a question, 0.0 if
      it names no task or offers a different one.
    threshold: 0.8
